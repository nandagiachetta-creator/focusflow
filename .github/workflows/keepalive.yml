name: Supabase keep-alive

# Consulta o banco 2x por semana para o plano gratuito do Supabase nao pausar o projeto.
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a tabela events
        run: |
          curl -fsS "https://vzuwlbhntbgvpyzvtqka.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: sb_publishable_6FkW_GQ7Dl6Uw7RArOBgWg_GKFF5DEE" \
            -H "Authorization: Bearer sb_publishable_6FkW_GQ7Dl6Uw7RArOBgWg_GKFF5DEE"
